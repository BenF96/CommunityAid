<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Community Assistance and Resource System">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a24"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.6" stop-color="#00a8c6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="heart" x1="0.15" y1="0.1" x2="0.85" y2="1">
      <stop offset="0" stop-color="#5ff0ff"/>
      <stop offset="0.55" stop-color="#00c8e6"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark tile with a cyan-to-magenta rim -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#tile)" stroke="url(#edge)" stroke-width="2"/>
  <circle cx="32" cy="35" r="24" fill="url(#glow)"/>

  <!-- Heart -->
  <path d="M32 51.5 15.6 35.4a10.6 10.6 0 0 1 15-15L32 21.8l1.4-1.4a10.6 10.6 0 0 1 15 15Z"
        fill="url(#heart)"/>
  <!-- Highlight on the heart's top-left lobe for depth -->
  <path d="M19.2 23.6a6.6 6.6 0 0 1 8.4-.8" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>

  <!-- Aid cross cut into the heart -->
  <path d="M29.6 27.5h4.8v5.1h5.1v4.8h-5.1v5.1h-4.8v-5.1h-5.1v-4.8h5.1Z" fill="#05070a"/>
</svg>
